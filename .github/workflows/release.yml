name: Build Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:

  # Validate Repository Configuration
  config:
    runs-on: ubuntu-latest
    outputs:
      config_package: ${{ steps.config_package.outputs.configPackage }}
    steps:

    # Ensure that required repository variable has been created for the Package
    - name: Validate Package Config
      id: config_package
      run: |
        if [ "${{ vars.PACKAGE_NAME }}" != "" ]; then
          echo "configPackage=true" >> $GITHUB_OUTPUT;
        else
          echo "configPackage=false" >> $GITHUB_OUTPUT;
        fi

  # Build and release the Package
  # If the repository is not configured properly, this job will be skipped
  build:
    needs: config
    runs-on: ubuntu-latest
    env:
      packagePath: Packages/${{ vars.PACKAGE_NAME }}
      assetStoreProject: .build/asset-store-project
      GH_TOKEN: ${{ github.token }}
    if: needs.config.outputs.config_package == 'true'
    steps:

      # Checkout Local Repository
      - name: Checkout
        uses: actions/checkout@v7.0.1

      # Get the Package version based on the package.json file
      - name: Get Version
        id: version
        uses: zoexx/github-action-json-file-properties@1.0.7
        with: 
            file_path: "${{ env.packagePath }}/package.json"
            prop_path: "version"
    
      # Configure the Environment Variables needed for releasing the Package
      - name: Set Environment Variables
        run: |
          echo "zipFile=${{ vars.PACKAGE_NAME }}-${{ steps.version.outputs.value }}".zip >> $GITHUB_ENV
          echo "vccUnityPackage=${{ vars.PACKAGE_NAME }}-vcc-${{ steps.version.outputs.value }}.unitypackage" >> $GITHUB_ENV
          echo "assetStoreUnityPackage=${{ vars.PACKAGE_NAME }}-asset-store-${{ steps.version.outputs.value }}.unitypackage" >> $GITHUB_ENV
          echo "version=${{ steps.version.outputs.value }}" >> $GITHUB_ENV
          echo "releaseTag=v${{ steps.version.outputs.value }}" >> $GITHUB_ENV

      # Zip the Package for release
      - name: Create Package Zip
        working-directory: "${{ env.packagePath }}"
        run: zip -r "${{ github.workspace }}/${{ env.zipFile }}" .
      
      - name: Track VCC UnityPackage Meta Files
        run: find "${{ env.packagePath }}/" -name \*.meta > vccMetaList
      
      - name: Create VCC UnityPackage
        uses: pCYSl5EDgo/create-unitypackage@v1.2.3
        with:
          package-path: ${{ env.vccUnityPackage }}
          include-files: vccMetaList

      - name: Stage Asset Store Package
        run: |
          python Tools/prepare_asset_store.py \
            --source "${{ env.packagePath }}" \
            --output "${{ env.assetStoreProject }}"
          cd "${{ env.assetStoreProject }}"
          find Assets -name \*.meta > assetStoreMetaList

      - name: Create Asset Store UnityPackage
        uses: pCYSl5EDgo/create-unitypackage@v1.2.3
        with:
          working-folder: ${{ env.assetStoreProject }}
          project-folder: ./
          package-path: ${{ github.workspace }}/${{ env.assetStoreUnityPackage }}
          include-files: assetStoreMetaList
      
      # Upload everything while the release is mutable, then publish it.
      # GitHub creates the tag as part of publishing the release.
      - name: Create Draft Release
        run: |
          if gh release view "${{ env.releaseTag }}" >/dev/null 2>&1; then
            echo "Release ${{ env.releaseTag }} already exists."
            exit 1
          fi

          gh release create "${{ env.releaseTag }}" \
            "${{ env.zipFile }}" \
            "${{ env.vccUnityPackage }}" \
            "${{ env.assetStoreUnityPackage }}" \
            "${{ env.packagePath }}/package.json" \
            --draft \
            --target "${{ github.sha }}" \
            --title "${{ env.releaseTag }}" \
            --generate-notes

      - name: Publish Release
        run: gh release edit "${{ env.releaseTag }}" --draft=false
